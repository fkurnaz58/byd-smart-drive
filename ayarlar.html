<style>
:root{--bg:#0E1A30;--card:#15264A;--border:#223A66;--tile:#11203E;--btn:#1B3260;--text:#F2F6FC;--sub:#A8B9D6;--muted:#7A8DB0;--accent:#2E86F5;--ok:#3BD18A;--warn:#FFB547}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:8px 0 4px;font-weight:650;letter-spacing:-.01em}h2{font-size:18px;margin:0 0 10px;font-weight:600}
.by{color:var(--sub);margin:0 0 18px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:0 0 14px}
.hint{color:var(--sub);font-size:14px;margin:6px 0 0}.btn{display:block;width:100%;text-align:center;border:0;border-radius:14px;padding:14px 16px;font:600 17px system-ui,sans-serif;background:var(--btn);color:var(--text);text-decoration:none;cursor:pointer;margin-top:12px}
.btn.primary{background:var(--accent);color:#fff}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border)}
.row:first-of-type{border-top:0}.row label{flex:1;font-size:15px}.val{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}input[type=text]{width:100%;background:var(--tile);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font:600 20px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:3px}.seg button{border:0;background:none;color:var(--sub);padding:6px 12px;border-radius:8px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}.sw{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--btn);position:relative;flex:none;cursor:pointer}
.sw:checked{background:var(--ok)}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}.sw:checked::after{left:21px}
.slider{padding:10px 0;border-top:1px solid var(--border)}.slider .top{display:flex;justify-content:space-between;gap:10px}
.msg{margin-top:12px;font-weight:600}.ok{color:var(--ok)}.err{color:var(--warn)}.lang{float:right}.small{font-size:13px;color:var(--muted)}
a{color:var(--accent)}
</style></head>
<body><main>
<div class="seg lang"><button data-l="tr" class="on">TR</button><button data-l="en">EN</button></div>
<h1 data-tr="Ayarlar" data-en="Settings">Ayarlar</h1><p class="by"><a href="index.html">BYD Smart Drive</a> · by Fatih Kurnaz</p>
<div class="card"><h2 data-tr="Aracın kodu" data-en="Car code">Aracın kodu</h2>
<input type="text" id="code" placeholder="K7Q2-M9XD" maxlength="9" autocomplete="off">
<p class="hint" data-tr="Araçtaki uygulamada Geliştirici seçenekleri sayfasının en üstünde yazan 8 haneli kod. Bir kez yazmanız yeterli, bu telefonda hatırlanır." data-en="The 8-character code at the top of Developer options in the car app. Enter it once; this phone remembers it.">…</p></div>
<div class="card"><h2 data-tr="Hız bantları ve batarya" data-en="Speed bands and battery">Hız bantları ve batarya</h2>

<div id="params"></div></div>
<div class="card"><h2 data-tr="Kurallar" data-en="Rules">Kurallar</h2><div id="rules"></div></div>
<button class="btn primary" id="send" data-tr="Arabaya gönder" data-en="Send to car">Arabaya gönder</button>
<div class="msg" id="msg"></div>
<p class="small" data-tr="Gönderilen yalnızca bu ayarlardır; konum, hesap ya da araç bilgisi gönderilmez. Araç kapalıysa ayarlar 12 saat bekler, araç açılınca uygulanır." data-en="Only these settings are sent; no location, account or car data. If the car is off, settings wait 12 hours and apply when it starts.">…</p>
</main><script>const PARAMS=[{"key": "band_city", "tr": "Şehir içi kuralı hız üst sınırı (km/s)", "en": "Urban rule upper speed limit (km/h)", "d": 50, "min": 20, "max": 90}, {"key": "band_hw", "tr": "Yol / otoyol kuralı başlangıç hızı (km/s)", "en": "Road / highway rule start speed (km/h)", "d": 80, "min": 50, "max": 120}, {"key": "band_sport", "tr": "Sport modu başlangıç hızı (km/s)", "en": "Sport mode start speed (km/h)", "d": 120, "min": 90, "max": 180}, {"key": "band_hyst", "tr": "Sınır payı (± km/s)", "en": "Limit margin (± km/h)", "d": 2, "min": 0, "max": 10}, {"key": "save_city", "tr": "Şehir içinde batarya modu", "en": "City battery mode", "d": 0, "min": 0, "max": 1}, {"key": "soc_city", "tr": "Şehir içinde SOC hedefi (%)", "en": "City SOC target (%)", "d": 25, "min": 15, "max": 80}, {"key": "save_mid", "tr": "Orta hızda batarya modu", "en": "Mid-speed battery mode", "d": 0, "min": 0, "max": 1}, {"key": "soc_mid", "tr": "Orta hızda SOC hedefi (%)", "en": "Mid-speed SOC target (%)", "d": 30, "min": 15, "max": 80}, {"key": "soc_mid_trigger", "tr": "Orta hızda: batarya şu yüzdenin altına düşerse hedefi uygula (%)", "en": "Mid speed: apply the target only if the battery is below (%)", "d": 55, "min": 15, "max": 100}, {"key": "buf_on", "tr": "Düz yolda batarya tamponu (AUTO'da %30 civarında tut)", "en": "Flat-road battery buffer (hold ~30% in AUTO)", "d": 1, "min": 0, "max": 1}, {"key": "buf_low", "tr": "Batarya tamponu alt sınırı (%)", "en": "Battery buffer lower limit (%)", "d": 30, "min": 20, "max": 60}, {"key": "hill_on", "tr": "Yokuşa hazırlık (öğrenilen yokuşlar)", "en": "Climb preparation (learned climbs)", "d": 1, "min": 0, "max": 1}, {"key": "buf_hill", "tr": "Yokuştan önce batarya hedefi (%)", "en": "Battery target before a climb (%)", "d": 40, "min": 25, "max": 70}, {"key": "hill_ahead", "tr": "Yokuşa kaç metre kala hazırlansın (m)", "en": "Prepare this many metres before a climb (m)", "d": 1500, "min": 500, "max": 3000}, {"key": "elev_on", "tr": "Yükseklik haritasıyla ileri bak (internet)", "en": "Look ahead with the elevation map (internet)", "d": 1, "min": 0, "max": 1}, {"key": "save_hw", "tr": "Yol / otoyolda batarya modu", "en": "Road / highway battery mode", "d": 0, "min": 0, "max": 1}, {"key": "soc_hw", "tr": "Yol / otoyolda SOC hedefi (%)", "en": "Road / highway SOC target (%)", "d": 55, "min": 15, "max": 80}, {"key": "save_sport", "tr": "Sport ve sollamada batarya modu", "en": "Battery mode for Sport, overtaking and uphill", "d": 0, "min": 0, "max": 1}, {"key": "soc_sport", "tr": "Sport ve sollamada SOC hedefi (%)", "en": "SOC target for Sport and overtaking (%)", "d": 55, "min": 15, "max": 80}, {"key": "save_downhill", "tr": "Dik inişte batarya modu", "en": "Steep downhill battery mode", "d": 1, "min": 0, "max": 1}, {"key": "soc_downhill", "tr": "Dik inişte SOC hedefi (%)", "en": "Steep downhill SOC target (%)", "d": 60, "min": 15, "max": 80}, {"key": "slope_up", "tr": "Yokuş yukarı olarak algılanacak eğim (°)", "en": "Slope detected as uphill (°)", "d": 4, "min": 2, "max": 10}, {"key": "pedal_overtake", "tr": "Sollama: gaz pedalı şunu geçince Sport (%)", "en": "Overtake: Sport when throttle exceeds (%)", "d": 65, "min": 40, "max": 95}, {"key": "pedal_overtake_end", "tr": "Sollama bitti: gaz şunun altına inince (%)", "en": "Overtake over: throttle drops below (%)", "d": 35, "min": 10, "max": 60}, {"key": "coast_on", "tr": "Düz yolda süzülme (gazı bırakınca standart rejen)", "en": "Flat-road coasting (standard regen when you lift)", "d": 1, "min": 0, "max": 1}, {"key": "coast_speed", "tr": "Süzülme: en az hız (km/s)", "en": "Coasting: minimum speed (km/h)", "d": 20, "min": 5, "max": 100}, {"key": "coast_slope_hi", "tr": "Düz yol sayılacak eğim artı (°)", "en": "Slope counted as flat road, plus (°)", "d": 2, "min": 0, "max": 6}, {"key": "coast_pedal", "tr": "Süzülme: gaz bırakıldı sayılacak pedal (%)", "en": "Coasting: throttle counted as released (%)", "d": 3, "min": 0, "max": 10}, {"key": "temp_summer", "tr": "Yaz kuralı: dış sıcaklık şunun üstünde (°C)", "en": "Summer rule: outside temperature above (°C)", "d": 28, "min": 20, "max": 40}, {"key": "tyre_min", "tr": "Lastik basıncı uyarı eşiği (PSI)", "en": "Tyre pressure warning threshold (PSI)", "d": 36, "min": 25, "max": 45}, {"key": "score_acc", "tr": "Sürüş puanı: ani hızlanma eşiği (km/s her saniye)", "en": "Driving score: hard acceleration threshold (km/h per second)", "d": 9, "min": 5, "max": 20}, {"key": "score_brake", "tr": "Sürüş puanı: ani fren eşiği (km/s her saniye)", "en": "Driving score: hard braking threshold (km/h per second)", "d": 11, "min": 6, "max": 25}, {"key": "score_speed", "tr": "Sürüş puanı: yüksek hız sınırı (km/s)", "en": "Driving score: high speed limit (km/h)", "d": 130, "min": 100, "max": 180}];const RULES=[{"id": "automation-1791660568412-8n01zpu", "tr": "A1 · Açılış – HEV + ECO + Yüksek Rejen", "en": "A1 · Start-up – HEV + ECO + High Regen"}, {"id": "band-city", "tr": "S1 · Şehir İçi (0–50 km/s)", "en": "S1 · City (0–50 km/h)"}, {"id": "band-mid", "tr": "S2 · Orta hız (50–80 km/s)", "en": "S2 · Mid speed (50–80 km/h)"}, {"id": "band-hw", "tr": "S3 · Yol / Otoyol (80–120 km/s)", "en": "S3 · Road / Highway (80–120 km/h)"}, {"id": "automation-1791660568412-0sqlj47", "tr": "C1 · Yokuş Yukarı – Normal + AUTO", "en": "C1 · Uphill – Normal + AUTO"}, {"id": "automation-1791660568412-njoxks8", "tr": "C2 · Yokuş Aşağı – Yüksek Rejen + ECO", "en": "C2 · Downhill – High Regen + ECO"}, {"id": "automation-1794000000000-dqmnbue", "tr": "C2b · Yokuş Aşağı – SAVE %60 (dik ve süren iniş)", "en": "C2b · Downhill – SAVE 60% (steep, sustained descent)"}, {"id": "automation-1791660568412-572rdbp", "tr": "D2 · Yüksek Hız – Sport (120+ km/s)", "en": "D2 · High Speed – Sport (120+ km/h)"}, {"id": "automation-1791660568412-3sstth5", "tr": "E1 · Sollama – Anlık Sport", "en": "E1 · Overtaking – Instant Sport"}, {"id": "automation-1791660568412-764jmmg", "tr": "E2 · Sollama/Gaz Bitti → Profile Dönüş (3 sn bekleme)", "en": "E2 · Overtake/Accelerator Released → Back to Profile (3 s wait)"}, {"id": "automation-1791660568412-uxrxmjk", "tr": "F1 · Sert Fren → Sport Fren", "en": "F1 · Hard Braking → Sport Brakes"}, {"id": "automation-1791660568412-69v8hbh", "tr": "F2 · Fren Bırakıldı → Konfor Fren", "en": "F2 · Brake Released → Comfort Brakes"}, {"id": "automation-uj5eq5tm", "tr": "G1 · Durunca – ECO + Yüksek Rejen", "en": "G1 · When Stopped – ECO + High Regen"}, {"id": "automation-1796000000000-gv7xwfb", "tr": "K1 · Ambiyans Işığı – Sürüş Modu ve Geri Vites", "en": "K1 · Ambient Light – Drive Mode and Reverse"}, {"id": "automation-1796000000000-cpzqods", "tr": "K2 · Ambiyans Işığı – Araç Açılınca", "en": "K2 · Ambient Light – On Start-up"}, {"id": "automation-1816000000000-lastik001", "tr": "L1 · Lastik Basıncı Düştü – Anında Uyarı", "en": "L1 · Tyre Pressure Low – Instant Warning"}, {"id": "automation-1816000000000-lastik002", "tr": "L2 · Araç Açılınca Lastik Basıncı Kontrolü", "en": "L2 · Tyre Pressure Check on Start-up"}, {"id": "automation-1816800000000-iklim006", "tr": "H1 · Kış: Araç Açıkken Buğu Önleme ve Isıtma", "en": "H1 · Winter: Demist and Heat While the Car Is On"}, {"id": "automation-1816800000000-iklim007", "tr": "H2 · Yaz: Araç Açılınca Kabin Serinletme", "en": "H2 · Summer: Cool the Cabin on Start-up"}];
const S={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let L=S.get('lang')||'tr';const changed={},rulesChanged={};
let saved={};try{saved=JSON.parse(S.get('values')||'{}')}catch(e){}
const t=(tr,en)=>L=='en'?en:tr;
function render(){
 const P=document.getElementById('params');P.innerHTML='';
 PARAMS.forEach(p=>{const v=saved.p?.[p.key]??p.d;
  if(p.key.startsWith('save_')){const r=document.createElement('div');r.className='row';
   r.innerHTML='<label>'+t(p.tr,p.en)+'</label><div class="seg"><button data-v="0">AUTO</button><button data-v="1">SAVE</button></div>';
   const bs=r.querySelectorAll('button');const mark=x=>bs.forEach(b=>b.classList.toggle('on',+b.dataset.v==x));mark(v);
   bs.forEach(b=>b.onclick=()=>{changed[p.key]=+b.dataset.v;mark(+b.dataset.v);keep()});P.appendChild(r);return}
  const r=document.createElement('div');r.className='slider';
  r.innerHTML='<div class="top"><label>'+t(p.tr,p.en)+'</label><span class="val"></span></div><input type="range" min="'+p.min+'" max="'+p.max+'" value="'+v+'">';
  const i=r.querySelector('input'),o=r.querySelector('.val');o.textContent=v;
  i.oninput=()=>{o.textContent=i.value;changed[p.key]=+i.value;keep()};P.appendChild(r)});
 const R=document.getElementById('rules');R.innerHTML='';
 RULES.forEach(x=>{const on=saved.r?.[x.id]??true;const r=document.createElement('div');r.className='row';
  r.innerHTML='<label>'+t(x.tr,x.en)+'</label><input type="checkbox" class="sw">';const c=r.querySelector('input');c.checked=on;
  c.onchange=()=>{rulesChanged[x.id]=c.checked;keep()};R.appendChild(r)});
 document.querySelectorAll('[data-'+L+']').forEach(e=>e.textContent=e.dataset[L]);
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));
}
function keep(){saved.p=Object.assign(saved.p||{},changed);saved.r=Object.assign(saved.r||{},rulesChanged);S.set('values',JSON.stringify(saved))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;S.set('lang',L);render()});
const code=document.getElementById('code');code.value=S.get('code')||'';
function norm(s){s=(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(s.length!=8||/[^ABCDEFGHJKLMNPQRSTUVWXYZ23456789]/.test(s))return null;return s}
document.getElementById('send').onclick=async()=>{const m=document.getElementById('msg');const c=norm(code.value);
 if(!c){m.className='msg err';m.textContent=t('Aracın kodunu kontrol edin (8 hane).','Check the car code (8 characters).');return}
 S.set('code',c.slice(0,4)+'-'+c.slice(4));
 const params=Object.assign({},saved.p||{},changed),rules=Object.assign({},saved.r||{},rulesChanged);
 if(!Object.keys(params).length&&!Object.keys(rules).length){m.className='msg err';m.textContent=t('Önce bir ayarı değiştirin.','Change a setting first.');return}
 const body={format:'smartdrive-settings',version:1,updatedAt:Date.now(),params,rules};
 m.className='msg';m.textContent=t('Gönderiliyor…','Sending…');
 try{const r=await fetch('https://ntfy.sh/bydsmartdrive-'+c.toLowerCase(),{method:'POST',body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status);m.className='msg ok';m.textContent=t('Gönderildi. Araç açıksa birkaç saniye içinde uygulanır.','Sent. If the car is on, it applies within seconds.')}
 catch(e){m.className='msg err';m.textContent=t('Gönderilemedi, internet bağlantısını kontrol edin.','Could not send, check your internet connection.')}};
render();
</script></body></html>
