<h1 data-tr="Ayarlar" data-en="Settings">Ayarlar</h1><p class="by"><a href="index.html">BYD Smart Drive</a> · by Fatih Kurnaz</p>
<div class="card"><h2 data-tr="Aracın kodu" data-en="Car code">Aracın kodu</h2>
<input type="text" id="code" placeholder="K7Q2-M9XD" maxlength="9" autocomplete="off">
<p class="hint" data-tr="Araçta Smart Drive: Menü > Sürüş ve Yolculuk > Telefon Bağlantısı. Kod orada yazar; QR kodu telefonla okutursanız kendiliğinden dolar. Bir kez yazmanız yeterli." data-en="In the car: Smart Drive Menu > Driving and Trips > Phone Link. The code is shown there; scan the QR code and it fills in by itself. Enter it once.">…</p></div>
<div class="card"><h2 data-tr="Ayarlar ve kurallar" data-en="Settings and rules">Ayarlar ve kurallar</h2>
<p class="hint" data-tr="Araçtaki Smart Drive ayarlarıyla aynı başlıklar. Başlığa dokunun, açılsın. Yalnızca değiştirdiğiniz ayarlar gönderilir; dokunmadıklarınız araçta olduğu gibi kalır." data-en="Same sections as the Smart Drive settings in the car. Tap a heading to open it. Only what you change is sent; the rest stays as it is in the car.">…</p>
<div id="cats"></div></div>
<button class="btn primary" id="send" data-tr="Arabaya gönder" data-en="Send to car">Arabaya gönder</button>
<div class="msg" id="msg"></div>
<p class="small" data-tr="Gönderilen yalnızca bu ayarlardır; konum, hesap ya da araç bilgisi gönderilmez. Araç kapalıysa ayarlar 12 saat bekler, araç açılınca uygulanır. Burada görünen değerler bu telefonda en son seçtiklerinizdir; araçta başka yerden değiştirildiyse farklı olabilir." data-en="Only these settings are sent; no location, account or car data. If the car is off, settings wait 12 hours and apply when it starts. Values shown are the last ones chosen on this phone; they may differ if changed elsewhere.">…</p>
<style>details.cat{border-top:1px solid var(--border)}details.cat:first-child{border-top:0}details.cat summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:600;font-size:16px;display:flex;justify-content:space-between;gap:10px}

</main><script>const PARAMS=[{"key": "buf_on", "tr": "Düz yolda batarya tamponu (azalınca SAVE)", "en": "Flat-road battery buffer (SAVE when low)", "d": 1, "min": 0, "max": 1, "cat": "buffer", "tog": true, "dtr": "Batarya azalınca düz yolda önceden şarj et. Açıkken: şehir ve orta hızda batarya alt sınıra inerse ve yol düzse, motor sakince çalışıp bataryayı hedefe kadar doldurur, sonra normal sürüşe döner. Gaza yüklenince, yokuşta ya da sollamada doldurma bekler (batarya o anki seviyede tutulur), 15 sn sakin yolda devam eder. Böylece batarya boşalmaz ve yokuşta motor şarj için bağırmaz.", "den": "Charge ahead of time on the flat when the battery gets low. When on: at city and mid speed, if the battery reaches the lower limit on a flat road, the engine charges calmly up to the target, then normal driving returns. The battery never runs flat and the engine doesn't roar on climbs."}, {"key": "hill_on", "tr": "Yokuşa hazırlık (öğrenilen yokuşlar)", "en": "Climb preparation (learned climbs)", "d": 1, "min": 0, "max": 1, "cat": "hill", "tog": true, "dtr": "Yokuşları öğren ve önceden hazırlan. Açıkken uygulama çıktığınız her yokuşun yerini kaydeder. Aynı yokuşa yaklaşırken batarya düşükse, yokuştan önce düz yolda şarj eder; yokuşta motor zorlanmaz. Bir yokuş en az 2 kez çıkıldıktan sonra hazırlık başlatır. Yokuşa 500 m'den az kalmışsa başlamaz; gazda ve yokuşta şarjı bekletir. Kayıtlar yalnız bu araçta durur.", "den": "Learn climbs and prepare in advance. When on, the app records where you climb. Approaching the same climb with a low battery, it charges on the flat beforehand so the engine isn't strained on the climb. A climb starts preparation after it has been climbed at least twice. It doesn't start under 500 m away and pauses charging on pedal/climb. Records stay on this car only."}, {"key": "elev_on", "tr": "Yükseklik haritasıyla ileri bak (internet)", "en": "Look ahead with the elevation map (internet)", "d": 1, "min": 0, "max": 1, "cat": "hill", "tog": true, "dtr": "Hiç gitmediğiniz yollar için ilerideki yokuşu internetten tahmin et. Gittiğiniz yönde 1–2 km ilerinin yüksekliğine bakar. Yanlış alarm olmasın diye yokuş art arda iki ölçümde görülmeli ve en az 30 m yükselmeli. Virajlı yolda yine yanılabilir; öğrenilen yokuşlar daha güvenilirdir. İnternet gerekir.", "den": "Guess climbs ahead on roads you've never driven, using the internet. It checks the height 1–2 km ahead in your direction. To avoid false alarms the climb must show up in two checks in a row and rise at least 30 m. It can still be wrong on winding roads; learned climbs are more reliable. Needs internet."}, {"key": "hwb_on", "tr": "Uzun yol tamponu (otoyolda düz yolda SAVE ile hedefe doldur)", "en": "Long-road buffer (highway: SAVE back to target on the flat)", "d": 1, "min": 0, "max": 1, "cat": "speed", "tog": true, "dtr": "Otoyolda araç AUTO hedefte bile düz ve sakin yolda elektriğe geçip bataryayı hedefin çok altına indirir. Açıkken: uzun yolda (bu hızın üstünde 1 dakika) batarya hedefin altına inerse (örnek: hedef %55, fark 4 → %51) ve yokuş ya da gaz yoksa SAVE ile %55'e kadar sessizce doldurur, sonra AUTO. Yokuşta, gaza yüklenince, sollamada ya da devir yüksekken şarj durur (120 üstü düz yolda SAVE o anki şarjda tutar, doldurmaz), AUTO hedefi o anki şarjın 3 altına iner; motor hem yol hem şarj için zorlanmaz. Yol 15 saniye sakin kalınca devam eder. Hız 2 dakika boyunca 15 km/s düşünce uzun yol biter.", "den": "On the highway the car goes electric on calm flat roads even in AUTO and drains the battery well below target. When on: on a long road (above this speed for 1 minute), if the battery drops below target (e.g. 55%, gap 4 → 51%) with no climb or heavy pedal, SAVE quietly charges it to 55%, then AUTO. On climbs, heavy pedal, overtaking or at high rpm charging pauses (above 120 on a flat road SAVE holds the current charge, no charging) and the AUTO target drops 3 below the current charge, so the engine isn't strained by both. It resumes after 15 calm seconds. The long road ends when speed stays 15 km/h lower for 2 minutes."}, {"key": "hwb_mtn", "tr": "Dağ yolu modu (elle)", "en": "Mountain road mode (manual)", "d": 0, "min": 0, "max": 1, "cat": "speed", "tog": true, "dtr": "Dağlık bölgede yaşıyorsan ya da rota girmeden dağ yoluna çıkıyorsan aç: uzun yolda düz ve sakin kesimlerde batarya Dağ yolu hedefine (65) doldurulur, yükte taban 40 olur. Navigasyonda rota girersen buna gerek yok, rotada büyük tırmanış görünce kendiliğinden yapar.", "den": "Turn on if you live in the mountains or drive a mountain road without a route: on a long road the battery is filled to the mountain target (65) on calm flat parts, and the load floor becomes 40. With a navigation route this happens on its own when a big climb is ahead."}, {"key": "coast_on", "tr": "Süzülme (düz yolda gazı bırakınca)", "en": "Coasting (when you lift off on flat road)", "d": 1, "min": 0, "max": 1, "cat": "coast", "tog": true, "dtr": "Düz yolda gazı bırakınca süzül. Açıkken: yol düzse ve gazdan ayağınızı çektiyseniz güçlü rejen hafif rejene iner; araç frenlenmez, süzülerek gider, enerji boşa gitmez. Frene basınca ya da yokuş/iniş gelince güçlü rejen geri gelir.", "den": "Glide when you lift off on a flat road. When on: if the road is flat and you lift off, strong regen drops to light regen; the car isn't braked, it glides and no energy is wasted. Braking or a slope brings strong regen back."}, {"key": "brk_on", "tr": "Ani frende Sport fren (sakin sürüşte konfor)", "en": "Sport brake on hard braking (comfort when calm)", "d": 1, "min": 0, "max": 1, "cat": "coast", "tog": true, "dtr": "Konfor frende ani bir duruşta pedal yumuşak kalabiliyor. Açıkken: sert frene basınca, aracın hızlı yavaşladığı görülünce ya da yüksek hızda fren Sport'a geçer (sıkı, hemen tutan pedal). Bir süre sakin sürünce konfor fren kendiliğinden geri gelir. Sport, yokuş aşağı ve sollama profillerinin kendi Sport freni olduğu gibi kalır. Not: ilk ani fren algılanınca geçer, yani o frenden sonraki frenler sıkı olur.", "den": "Comfort brake can feel soft in a sudden stop. When on: a hard press, a fast slowdown or high speed switches the brake to Sport (firm, immediate pedal). After a while of calm driving comfort brake returns by itself. Profiles that already use Sport brake keep it. Note: it switches when the first hard stop is seen, so the stops after it are firm."}, {"key": "tyre_leak", "tr": "Lastikte yavaş kaçak uyarısı", "en": "Slow tyre leak warning", "d": 1, "min": 0, "max": 1, "cat": "comfort", "tog": true, "dtr": "Açıkken her lastiğin soğuk basıncı (araç en az 2 saat durduktan sonra ilk sürüş) günlerce izlenir. Bir lastik diğer üçüne göre yavaş yavaş düşüyorsa (çivi, sibop kaçağı) uyarı eşiğine inmeden önce günde bir kez ekranda uyarır. Araca komut göndermez.", "den": "When on, each tyre's cold pressure (first drive after at least 2 hours parked) is tracked for days. If one tyre slowly drops compared with the other three (nail, valve leak) you are warned once a day before it reaches the warning threshold. Sends no command to the car."}, {"key": "band_city", "tr": "Şehir içi kuralı hız üst sınırı (km/s)", "en": "Urban rule upper speed limit (km/h)", "d": 50, "min": 20, "max": 90, "cat": "speed", "tog": false, "dtr": "Şehir hızının üst sınırı. Bu hızın altında araç Eco modda ve güçlü rejenle (gazı bırakınca araç kendini yavaşlatıp bataryayı doldurur) tasarruflu gider. Örnek 50: 50 km/s altı şehir sayılır.", "den": "Top of city speed. Below it the car drives in Eco with strong regen (lifting off slows the car and charges the battery). Example 50: below 50 km/h counts as city."}, {"key": "band_hw", "tr": "Yol / otoyol kuralı başlangıç hızı (km/s)", "en": "Road / highway rule start speed (km/h)", "d": 85, "min": 50, "max": 120, "cat": "speed", "tog": false, "dtr": "Yol/otoyol hızının başlangıcı. Bu hızın üstünde araç Normal moda geçer ve rejen hafifler; gazı bırakınca araç süzülür. Şehir sınırı ile bu sınır arası orta hızdır.", "den": "Start of road/highway speed. Above it the car switches to Normal and regen gets lighter; lifting off lets the car glide. Between the City limit and this is mid speed."}, {"key": "band_sport", "tr": "Sport modu başlangıç hızı (km/s)", "en": "Sport mode start speed (km/h)", "d": 120, "min": 90, "max": 180, "cat": "speed", "tog": false, "dtr": "Bu hızın üstünde araç Sport moda geçer; direksiyon ve fren sıkılaşır, tepki canlanır. Yol sınırından en az 10 km/s yukarıda olmalı.", "den": "Above this speed the car switches to Sport; steering and brakes firm up and response gets sharper. Keep it at least 10 km/h above the Road limit."}, {"key": "band_hyst", "tr": "Sınır payı (± km/s)", "en": "Limit margin (± km/h)", "d": 2, "min": 0, "max": 10, "cat": "speed", "tog": false, "dtr": "Hız tam sınırdayken modun sürekli değişip durmasını önleyen pay. Örnek 2 ve sınır 80: 82'de Normal'e geçer, 78'de Eco'ya döner. Çoğu kişi için 2 iyidir.", "den": "A margin that stops the mode switching back and forth right at a limit. Example 2 with limit 80: Normal at 82, back to Eco at 78. 2 suits most people."}, {"key": "soc_city", "tr": "Şehir içinde batarya hedefi (%)", "en": "City battery target (%)", "d": 30, "min": 15, "max": 80, "cat": "speed", "tog": false, "dtr": "SOC = bataryanın doluluk yüzdesi. Şehirde batarya bu yüzdenin altına inmemeye çalışır. Düşük tutarsanız şehirde daha çok elektrikle gidersiniz; çok düşükse motor daha sık çalışır.", "den": "SOC = battery charge percentage. In the city the battery tries not to drop below this. Lower means more electric driving in town; too low makes the engine run more often."}, {"key": "soc_mid", "tr": "Orta hızda batarya hedefi (%)", "en": "Mid-speed battery target (%)", "d": 30, "min": 15, "max": 80, "cat": "speed", "tog": false, "dtr": "Orta hızda bataryanın inmemeye çalışacağı yüzde. Yüksek tutarsanız motor orta hızda bataryayı şarj etmek için daha çok çalışır.", "den": "The percentage the battery tries to stay above at mid speed. Higher makes the engine work more to charge at mid speed."}, {"key": "buf_low", "tr": "Batarya tamponu alt sınırı (%)", "en": "Battery buffer lower limit (%)", "d": 30, "min": 20, "max": 60, "cat": "buffer", "tog": false, "dtr": "Batarya bu yüzdeye inince (ve yol düzse) tampon şarjı başlar. Örnek 30: %30'a inince araç düz yolda şarj etmeye başlar.", "den": "When the battery drops to this (on a flat road), buffer charging starts. Example 30: at 30% the car starts charging on the flat."}, {"key": "buf_hold", "tr": "Tamponda batarya hedefi (%)", "en": "Buffer battery target (%)", "d": 35, "min": 25, "max": 70, "cat": "buffer", "tog": false, "dtr": "Tampon başlayınca batarya bu yüzdeye kadar doldurulur. Alt sınırdan en az 3 puan yüksek olur (daha azını uygulama kendisi 3'e tamamlar). Örnek 35: %30'dan %35'e kadar şarj eder.", "den": "Once the buffer starts, the battery is charged up to this. It stays at least 3 points above the lower limit (the app raises it to 3 if lower). Example 35: charges from 30% to 35%."}, {"key": "buf_hill", "tr": "Yokuştan önce batarya hedefi (%)", "en": "Battery target before a climb (%)", "d": 50, "min": 25, "max": 70, "cat": "hill", "tog": false, "dtr": "Önde yokuş varken batarya bu yüzdenin altındaysa, yokuştan önce bu yüzdenin 2 fazlasına kadar şarj edilir (örnek 50 → %52).", "den": "With a climb ahead, if the battery is below this, it is charged to 2 points above it before the climb (example 50 → 52%)."}, {"key": "hill_ahead", "tr": "Yokuşa kaç metre kala hazırlansın (m)", "en": "Prepare this many metres before a climb (m)", "d": 1500, "min": 500, "max": 3000, "cat": "adv", "tog": false, "dtr": "Yokuşa kaç metre kala hazırlık başlasın. Uzun mesafe = daha erken ve daha çok şarj. Şarj yavaş olduğu için 1500 m ve üstü önerilir.", "den": "How many metres before the climb preparation starts. Longer = earlier and more charging. Charging is slow, so 1500 m or more is recommended."}, {"key": "soc_hw", "tr": "Uzun yol batarya hedefi (%)", "en": "Long-road battery target (%)", "d": 55, "min": 45, "max": 65, "cat": "speed", "tog": false, "dtr": "Uzun yolda (otoyol hızında 1 dakika) batarya bu yüzdeye inmeden tutulur: %4 aşağı inince düz ve sakin yolda sessizce bu yüzdeye doldurulur, yokuşta, sollamada ve yüksek hızda şarja zorlanmaz. Örnek 55. 45–65 arası seçilebilir; yüksek tutmak 130'da motoru şarj için zorlar.", "den": "On a long road (1 minute at road speed) the battery is held near this: when it drops 4 points it is quietly refilled on calm flat road, never forced to charge on climbs, overtakes or at high speed. Example 55. Range 45–65; higher makes the engine work to charge at 130."}, {"key": "hwb_pedal", "tr": "Uzun yol tamponu: gaz pedalı bunun altındayken şarj et (%)", "en": "Long-road buffer: charge only below this pedal (%)", "d": 35, "min": 10, "max": 80, "cat": "adv", "tog": false, "dtr": "Gaz pedalı bu yüzdenin üstündeyse (hızlanma, rampa) şarj durur, araç AUTO'da kendi karar verir; böylece motor hem çekiş hem şarj için bağırmaz. Örnek 35.", "den": "Above this pedal (accelerating, ramp) charging pauses and the car decides in AUTO, so the engine doesn't roar for both pulling and charging. Example 35."}, {"key": "hwb_gap", "tr": "Uzun yol tamponu: hedefin kaç puan altında başlasın", "en": "Long-road buffer: start this many points below target", "d": 4, "min": 2, "max": 15, "cat": "adv", "tog": false, "dtr": "Uzun yol batarya hedefinin kaç puan altında şarj başlasın. Örnek 4 ve hedef %55: %51'de başlar, %55'te biter. Çok küçük olursa motor sık açılıp kapanır.", "den": "How many points below the road/highway SOC target charging starts. Example 4 with target 55%: starts at 51%, ends at 55%. Too small and the engine starts and stops often."}, {"key": "hwb_rpm", "tr": "Sessiz otoyol: devir bekçisi sınırı (devir)", "en": "Quiet motorway: rpm guard limit (rpm)", "d": 5000, "min": 3000, "max": 7000, "cat": "adv", "tog": false, "dtr": "Devir bu sınırı 3 saniye geçerse şarj durdurulur (yedek emniyet); 1000 altına inince bırakılır. Fatih'in testinde bağırma 5000 üstünde başladı.", "den": "If rpm stays above this for 3 seconds charging stops (backup guard); released 1000 below. In testing the roar started above 5000."}, {"key": "hwb_floor", "tr": "Sessiz otoyol: hedef bunun altına inmesin (%)", "en": "Quiet motorway: target never below (%)", "d": 48, "min": 30, "max": 48, "cat": "adv", "tog": false, "dtr": "Sessiz otoyolda hedef her yükte biraz iner; yol boyunca şarj hedefe yaklaştıkça hedef 3 puan daha iner; bu taban batarya uzun hızlı yolda bunun altına kaymasın diye. Örnek 48.", "den": "On a quiet motorway the target drops a little on each load; as charge nears it the target steps down again; this floor stops it sliding lower on a long fast drive. Example 48."}, {"key": "hwb_climb_floor", "tr": "Uzun tırmanışta taban (%)", "en": "Floor on a long climb (%)", "d": 38, "min": 30, "max": 48, "cat": "adv", "tog": false, "dtr": "Araç gerçekten 45 m'den fazla tırmanınca (Pozantı, Bolu gibi uzun yokuşlar) yükte hedef 48 yerine bu tabana kadar inebilir; motor yokuşta şarj için bağırmaz, batarya da dibe inmez. Tırmanış bitince normale döner. Örnek 38.", "den": "When the car has really climbed more than 45 m (long mountain passes), under load the target may drop to this floor instead of 48, so the engine does not roar to charge on the climb and the battery does not run empty. Back to normal when the climb ends. Example 38."}, {"key": "hwb_hi_floor", "tr": "120 üstünde taban (%)", "en": "Floor above 120 (%)", "d": 40, "min": 30, "max": 48, "cat": "adv", "tog": false, "dtr": "Uzun yolda 125'i geçince uygulama SAVE'de tutmaz, AUTO'ya geçer: hedef o anki şarjın 3 altı, batarya motora yardım eder, motor daha az bağırır. Batarya bu tabana inince SAVE ile burada tutulur; 120 altına inince sessiz hızlarda yeniden %55'e doldurur. Batarya zaten bunun altındaysa o anki şarjda tutar. Örnek 40.", "den": "On a long road above 125 the app switches to AUTO instead of holding SAVE: target 3 below current charge so the battery helps the engine and it roars less. When the battery reaches this floor it is held there with SAVE; below 120 it charges back to 55% at quiet speeds. If already below, it holds the current charge. Example 40."}, {"key": "hwb_low_speed", "tr": "Uzun yolda doldurma alt hızı (km/s)", "en": "Long road: lowest charging speed (km/h)", "d": 50, "min": 30, "max": 85, "cat": "adv", "tog": false, "dtr": "Uzun yol bir kez başladıysa (85 üstü 1 dk) trafikte yavaşlayınca bitmez: hız bu değerin altında kesintisiz 5 dakika kalınca biter. Doldurma da bu hıza kadar sürer; hız yüzünden kesilirse toparlanınca 5 sn'de yeniden başlar. Uzun yoldayken şehir tamponu (%35) çalışmaz, hedef doğrudan uzun yol hedefidir. Örnek 50.", "den": "Once a long road has started (above 85 for 1 min) it does not end in traffic: it ends only after 5 minutes continuously below this speed. Charging also continues down to this speed; if speed interrupts it, it resumes 5 s after speed recovers. On a long road the city buffer (35%) is off and the target is the long-road target. Example 50."}, {"key": "hwb_mtn_soc", "tr": "Dağ yolu: tırmanıştan önce doldurma hedefi (%)", "en": "Mountain road: pre-climb charge target (%)", "d": 65, "min": 55, "max": 75, "cat": "adv", "tog": false, "dtr": "Rotada önümüzdeki 25 km'de 300 m'den fazla tırmanış görünürse (ya da Dağ yolu modu açıksa) uzun yol hedefi bu değere çıkar; batarya yokuştan önce, düz ve sakin yolda dolar. Tırmanışta şarj durur, batarya motora yardım eder. Örnek 65.", "den": "If the route shows more than 300 m of climbing in the next 25 km (or Mountain road mode is on), the long-road target rises to this value; the battery fills before the climb on calm flat road. On the climb charging stops and the battery helps the engine. Example 65."}, {"key": "soc_sport", "tr": "Sport ve sollamada batarya hedefi (%)", "en": "Battery target for Sport and overtaking (%)", "d": 55, "min": 15, "max": 80, "cat": "adv", "tog": false, "dtr": "Sport ve sollamada batarya hedefi. v6.65: hedef hiçbir zaman o anki şarjın üstüne çıkmaz (şarj − 3); sollarken motor bataryayı doldurmaya kalkmaz.", "den": "Battery target in Sport and overtaking. Since v6.65 it never rises above the current charge (charge − 3), so the engine doesn't try to charge while overtaking."}, {"key": "slope_up", "tr": "Yokuş yukarı olarak algılanacak eğim", "en": "Slope detected as uphill", "d": 4, "min": 2, "max": 10, "cat": "hill", "tog": false, "dtr": "Yol bu eğimden dik olursa yokuş yukarı sayılır; araç Normal moda geçip güç verir. Ana ekrandaki eğim kartıyla aynı birim (derece ya da yüzde, üstteki Eğim birimi seçimi). Örnek +4° ≈ +7%: bunun üstü yokuştur.", "den": "A road steeper than this counts as uphill; the car switches to Normal for power. Same unit as the home slope card (degrees or percent, see Slope unit above). Example +4° ≈ +7%: above it is a climb."}, {"key": "slope_down", "tr": "Yokuş aşağı olarak algılanacak eğim (eksi)", "en": "Slope detected as downhill (negative)", "d": -5, "min": -10, "max": -2, "cat": "hill", "tog": false, "dtr": "Yol bu eksi eğimden dik inerse yokuş aşağı sayılır; güçlü rejen ve sıkı fren açılır. Örnek -5° ≈ -9%: bundan dik iniş.", "den": "A road descending steeper than this negative slope counts as downhill; strong regen and a firm brake come on. Example -5° ≈ -9%: steeper than that."}, {"key": "slope_steep", "tr": "Dik iniş olarak algılanacak eğim (eksi)", "en": "Slope detected as steep downhill (negative)", "d": -8, "min": -15, "max": -4, "cat": "hill", "tog": false, "dtr": "Bundan daha dik iniş 'dik iniş' sayılır (eski kurallar için).", "den": "A descent steeper than this counts as steep (for older rules)."}, {"key": "pedal_overtake", "tr": "Sollama: gaz pedalı şunu geçince Sport (%)", "en": "Overtake: Sport when throttle exceeds (%)", "d": 60, "min": 40, "max": 95, "cat": "overtake", "tog": false, "dtr": "Gaz pedalına bu yüzdeden fazla basınca araç sollama yaptığınızı anlar ve hemen Sport'a geçer. Çok düşük tutarsanız normal hızlanmada da Sport'a geçer.", "den": "Pressing the throttle past this percentage tells the car you're overtaking, and it switches to Sport at once. Too low and it switches to Sport on normal acceleration too."}, {"key": "pedal_overtake_end", "tr": "Sollama bitti: gaz şunun altına inince (%)", "en": "Overtake over: throttle drops below (%)", "d": 25, "min": 10, "max": 60, "cat": "overtake", "tog": false, "dtr": "Gaz bu yüzdenin altına inip 3 sn kalınca sollama bitmiş sayılır ve sakin moda dönülür. Sollama gazından en az 15 puan düşük olmalı.", "den": "When the throttle stays below this for 3 s, overtaking is over and the calm mode returns. Keep it at least 15 points below the overtake throttle."}, {"key": "coast_speed", "tr": "Süzülme: başlangıç hızı (km/s)", "en": "Coasting: start speed (km/h)", "d": 20, "min": 5, "max": 100, "cat": "coast", "tog": false, "dtr": "Süzülme bu hızdan başlar. Altında güçlü rejen kalır, çünkü yavaş trafikte aracın kendini yavaşlatması işinize yarar.", "den": "Coasting starts at this speed. Below it strong regen stays, since self-braking helps in slow traffic."}, {"key": "coast_speed_max", "tr": "Süzülme: bitiş hızı (km/s)", "en": "Coasting: end speed (km/h)", "d": 80, "min": 20, "max": 180, "cat": "coast", "tog": false, "dtr": "Süzülme bu hıza kadar çalışır. Yol sınırının üstünde rejen zaten hafif olduğu için araç orada da süzülür.", "den": "Coasting works up to this speed. Above the Road limit regen is already light, so the car glides there too."}, {"key": "coast_slope_hi", "tr": "Düz yol sayılacak eğim (artı)", "en": "Slope counted as flat road (plus)", "d": 2, "min": 0, "max": 6, "cat": "coast", "tog": false, "dtr": "Süzülme için yol en çok bu kadar yokuş olabilir. Örnek +2° ≈ +3%: buna kadar düz sayılır.", "den": "For coasting the road may climb at most this much. Example +2° ≈ +3%: up to that counts as flat."}, {"key": "coast_slope_lo", "tr": "Düz yol sayılacak eğim (eksi)", "en": "Slope counted as flat road (minus)", "d": -2, "min": -6, "max": 0, "cat": "coast", "tog": false, "dtr": "Süzülme için yol en çok bu kadar iniş (eksi) olabilir. Daha dik inişte araç kendini frenlesin diye güçlü rejen kalır. Örnek -2° ≈ -3%.", "den": "For coasting the road may descend at most this much (negative). On steeper descents strong regen stays so the car brakes itself. Example -2° ≈ -3%."}, {"key": "coast_pedal", "tr": "Süzülme: gaz bırakıldı sayılacak pedal (%)", "en": "Coasting: throttle counted as released (%)", "d": 3, "min": 0, "max": 10, "cat": "coast", "tog": false, "dtr": "Gaz bu yüzdenin altındaysa ayağınızı çekmiş sayılır. 1–3 arası, ayağın pedala hafifçe değdiği durumu da kapsar.", "den": "Throttle below this counts as lifted off. 1–3 also covers a foot resting lightly on the pedal."}, {"key": "coast_pre_pedal", "tr": "Süzülme: gaz azalırken erken geçiş (%)", "en": "Coasting: early switch while easing off (%)", "d": 15, "min": 0, "max": 40, "cat": "coast", "tog": false, "dtr": "Gaz bu yüzdenin altına düşerken (ayağınızı çekerken) standart rejen ÖNCEDEN gönderilir; ayağınız tam kalktığında araç zaten süzülmeye hazırdır. Gaza basılıyken rejen ayarı hissedilmez. 0 = kapalı (yalnız gaz tam bırakılınca geçer).", "den": "While the throttle drops below this percentage (easing off), standard regen is sent IN ADVANCE, so the car is ready to coast when your foot lifts. The regen setting is not felt while on the throttle. 0 = off (switch only after full lift-off)."}, {"key": "brk_decel", "tr": "Ani fren: yavaşlama eşiği (km/s her saniye)", "en": "Hard brake: deceleration threshold (km/h per second)", "d": 12, "min": 6, "max": 30, "cat": "coast", "tog": false, "dtr": "Araç bir saniyede bundan fazla yavaşlarsa ani fren sayılır. Normal şehir freni 5–10, sert fren 12 ve üstüdür. Düşürürseniz Sport fren daha kolay açılır.", "den": "Losing more than this km/h in one second counts as a hard stop. Normal city braking is 5–10, hard braking 12 and above. Lower it and Sport brake comes on more easily."}, {"key": "brk_pedal", "tr": "Ani fren: fren pedalı eşiği (%)", "en": "Hard brake: brake pedal threshold (%)", "d": 40, "min": 15, "max": 90, "cat": "coast", "tog": false, "dtr": "Fren pedalına bu yüzdeden fazla basınca (araç 10 km/s üstündeyken, hız fark etmez) ani fren sayılır. Duran araçta frene basılı tutmak sayılmaz.", "den": "Pressing the brake past this percentage (above 10 km/h, any speed) counts as a hard stop. Holding the brake while stopped doesn't count."}, {"key": "brk_speed", "tr": "Bu hızın üstünde hep Sport fren (km/s)", "en": "Always Sport brake above this speed (km/h)", "d": 90, "min": 50, "max": 180, "cat": "coast", "tog": false, "dtr": "Bu hızın üstünde fren hep Sport olur. Hız bunun 10 km/s altına inip sakin süre dolunca konfora döner.", "den": "Above this speed the brake is always Sport. It returns to comfort once speed is 10 km/h below this and the calm time has passed."}, {"key": "brk_calm", "tr": "Konfor frene dönmek için sakin süre (sn)", "en": "Calm time before comfort brake returns (s)", "d": 60, "min": 15, "max": 600, "cat": "coast", "tog": false, "dtr": "Son ani frenden (ya da yüksek hızdan) bu kadar saniye sonra konfor fren geri gelir. Yeni bir ani fren süreyi baştan başlatır. Kısa tutarsanız fren sık gidip gelir.", "den": "Comfort brake returns this many seconds after the last hard stop (or high speed). A new hard stop restarts the timer. Keep it short and the brake switches often."}, {"key": "temp_winter", "tr": "Kış kuralı: dış sıcaklık şunun altında (°C)", "en": "Winter rule: outside temperature below (°C)", "d": 10, "min": -10, "max": 20, "cat": "comfort", "tog": false, "dtr": "Dışarısı bu sıcaklığın altındaysa kış kuralı çalışır (araç açılınca ısıtma ve ön cam buğu çözme).", "den": "Below this outside temperature the winter rule runs (heating and windscreen demist at start)."}, {"key": "temp_summer", "tr": "Yaz kuralı: dış sıcaklık şunun üstünde (°C)", "en": "Summer rule: outside temperature above (°C)", "d": 28, "min": 20, "max": 40, "cat": "comfort", "tog": false, "dtr": "Dışarısı bu sıcaklığın üstündeyse yaz kuralı çalışır (araç açılınca serinletme).", "den": "Above this outside temperature the summer rule runs (cooling at start)."}, {"key": "ac_blow", "tr": "Klima AUTO'da hava yönü", "en": "A/C AUTO air direction", "d": 1, "min": 0, "max": 3, "cat": "comfort", "tog": false, "dtr": "Smart Drive'daki AUTO düğmesine (ya da AUTO kuralına) basınca klima açılır, AUTO'ya geçer, 1,5 sn sonra hava yönü buradaki seçime alınır ve araçtan geri okunup sonuç ekranda yazar. Aracın kendi AUTO'su yalnız ortadan üfler. Her sürücü profilinin kendi seçimi olur. 'Aracın kendi ayarı' seçilirse yöne dokunulmaz.", "den": "When you press AUTO in Smart Drive (or an AUTO rule runs) the A/C turns on, switches to AUTO, and 1.5 s later the air direction is set to this choice, read back from the car and shown on screen. The car's own AUTO only blows from the centre vents. Each driver profile has its own choice. 'Car's own setting' leaves the direction alone."}, {"key": "tyre_min", "tr": "Lastik basıncı uyarı eşiği (PSI)", "en": "Tyre pressure warning threshold (PSI)", "d": 37, "min": 25, "max": 45, "cat": "comfort", "tog": false, "dtr": "Herhangi bir lastiğin havası bu değerin (PSI) altına inince ekranda uyarı çıkar. Aracınızın kapı kenarındaki etikette önerilen basınç yazar.", "den": "A warning shows when any tyre falls below this pressure (PSI). The recommended pressure is on the label by the driver's door."}, {"key": "score_acc", "tr": "Sürüş puanı: ani hızlanma eşiği (km/s her saniye)", "en": "Driving score: hard acceleration threshold (km/h per second)", "d": 9, "min": 5, "max": 20, "cat": "adv", "tog": false, "dtr": "Bir saniyede bundan fazla hızlanmak 'ani hızlanma' sayılır ve sürüş puanını düşürür.", "den": "Gaining more than this km/h in one second counts as hard acceleration and lowers the driving score."}, {"key": "score_brake", "tr": "Sürüş puanı: ani fren eşiği (km/s her saniye)", "en": "Driving score: hard braking threshold (km/h per second)", "d": 11, "min": 6, "max": 25, "cat": "adv", "tog": false, "dtr": "Bir saniyede bundan fazla yavaşlamak 'ani fren' sayılır ve sürüş puanını düşürür.", "den": "Losing more than this km/h in one second counts as hard braking and lowers the driving score."}, {"key": "score_speed", "tr": "Sürüş puanı: yüksek hız sınırı (km/s)", "en": "Driving score: high speed limit (km/h)", "d": 130, "min": 100, "max": 180, "cat": "adv", "tog": false, "dtr": "Bu hızın üstünde geçen süre sürüş puanını düşürür.", "den": "Time spent above this speed lowers the driving score."}];const RULES=[{"id": "automation-1791660568412-8n01zpu", "tr": "A1 · Açılış – HEV + ECO + Yüksek Rejen", "en": "A1 · Start-up – HEV + ECO + High Regen", "cat": "speed"}, {"id": "band-city", "tr": "S1 · Şehir İçi (0–50 km/s)", "en": "S1 · City (0–50 km/h)", "cat": "speed"}, {"id": "band-mid", "tr": "S2 · Orta hız (50–80 km/s)", "en": "S2 · Mid speed (50–80 km/h)", "cat": "speed"}, {"id": "band-hw", "tr": "S3 · Yol / Otoyol (80–120 km/s)", "en": "S3 · Road / Highway (80–120 km/h)", "cat": "speed"}, {"id": "automation-1791660568412-0sqlj47", "tr": "C1 · Yokuş Yukarı – Normal + AUTO", "en": "C1 · Uphill – Normal + AUTO", "cat": "hill"}, {"id": "automation-1791660568412-njoxks8", "tr": "C2 · Yokuş Aşağı – Yüksek Rejen + ECO", "en": "C2 · Downhill – High Regen + ECO", "cat": "hill"}, {"id": "automation-1794000000000-dqmnbue", "tr": "C2b · Yokuş Aşağı – SAVE %60 (dik ve süren iniş)", "en": "C2b · Downhill – SAVE 60% (steep, sustained descent)", "cat": "hill"}, {"id": "automation-1791660568412-572rdbp", "tr": "D2 · Yüksek Hız – Sport (120+ km/s)", "en": "D2 · High Speed – Sport (120+ km/h)", "cat": "speed"}, {"id": "automation-1791660568412-3sstth5", "tr": "E1 · Sollama – Anlık Sport", "en": "E1 · Overtaking – Instant Sport", "cat": "overtake"}, {"id": "automation-1791660568412-764jmmg", "tr": "E2 · Sollama/Gaz Bitti → Profile Dönüş (3 sn bekleme)", "en": "E2 · Overtake/Accelerator Released → Back to Profile (3 s wait)", "cat": "overtake"}, {"id": "automation-1791660568412-uxrxmjk", "tr": "F1 · Sert Fren → Sport Fren", "en": "F1 · Hard Braking → Sport Brakes", "cat": "coast"}, {"id": "automation-1791660568412-69v8hbh", "tr": "F2 · Fren Bırakıldı → Konfor Fren", "en": "F2 · Brake Released → Comfort Brakes", "cat": "coast"}, {"id": "automation-uj5eq5tm", "tr": "G1 · Durunca – ECO + Yüksek Rejen", "en": "G1 · When Stopped – ECO + High Regen", "cat": "speed"}, {"id": "automation-1796000000000-gv7xwfb", "tr": "K1 · Ambiyans Işığı – Sürüş Modu ve Geri Vites", "en": "K1 · Ambient Light – Drive Mode and Reverse", "cat": "comfort"}, {"id": "automation-1796000000000-cpzqods", "tr": "K2 · Ambiyans Işığı – Araç Açılınca", "en": "K2 · Ambient Light – On Start-up", "cat": "comfort"}, {"id": "automation-1816000000000-lastik001", "tr": "L1 · Lastik Basıncı Düştü – Anında Uyarı", "en": "L1 · Tyre Pressure Low – Instant Warning", "cat": "comfort"}, {"id": "automation-1816000000000-lastik002", "tr": "L2 · Araç Açılınca Lastik Basıncı Kontrolü", "en": "L2 · Tyre Pressure Check on Start-up", "cat": "comfort"}, {"id": "automation-1816800000000-iklim006", "tr": "H1 · Kış: Araç Açıkken Buğu Önleme ve Isıtma", "en": "H1 · Winter: Demist and Heat While the Car Is On", "cat": "comfort"}, {"id": "automation-1816800000000-iklim007", "tr": "H2 · Yaz: Araç Açılınca Kabin Serinletme", "en": "H2 · Summer: Cool the Cabin on Start-up", "cat": "comfort"}];const CATS=[["speed", "Hıza göre sürüş (şehir, orta, yol, uzun yol)", "Driving by speed (city, mid, road, long road)"], ["hill", "Yokuş ve iniş", "Climbs and descents"], ["buffer", "Batarya tamponu (her hızda)", "Battery buffer (any speed)"], ["coast", "Süzülme ve fren (her hızda)", "Coasting and braking (any speed)"], ["overtake", "Sollama", "Overtaking"], ["comfort", "Konfor ve uyarılar (klima, ambiyans, lastik)", "Comfort and alerts (climate, ambient, tyres)"], ["adv", "Gelişmiş", "Advanced"]];
const S={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let L=S.get('lang')||'tr';const changed={},rulesChanged={};let openCat=null;
let saved={};try{saved=JSON.parse(S.get('values')||'{}')}catch(e){}
const t=(tr,en)=>L=='en'?en:tr;
const BLOW=[['Aracın kendi','Car default'],['Yüz + cam + ayak','Face + screen + feet'],['Yüz + ayak','Face + feet'],['Ayak + cam','Feet + screen']];
function fmt(p,v){if(p.key=='ac_blow')return t(...BLOW[v]||['?','?']);if(p.key.startsWith('slope_')||p.key.startsWith('coast_slope'))return(v>0?'+':'')+v+'°';return String(v)}
function cur(p){return changed[p.key]??saved.p?.[p.key]??p.d}
function item(p){const r=document.createElement('div');r.className='it';const v=cur(p);
 const d=p.dtr?'<div class="d">'+t(p.dtr,p.den)+'</div>':'';
 if(p.tog){r.innerHTML='<div class="top"><label>'+t(p.tr,p.en)+'</label><input type="checkbox" class="sw"></div>'+d;
  const c=r.querySelector('input');c.checked=v==1;c.onchange=()=>{changed[p.key]=c.checked?1:0;r.classList.add('chg');keep()};return r}
 r.innerHTML='<div class="top"><label>'+t(p.tr,p.en)+'</label><div class="pm"><button>−</button><span class="val"></span><button>+</button></div></div>'+d;
 const [mi,pl]=r.querySelectorAll('button'),o=r.querySelector('.val');o.textContent=fmt(p,v);const st=p.key=='hill_ahead'?100:1;
 const ch=s=>{const n=Math.min(p.max,Math.max(p.min,cur(p)+s));changed[p.key]=n;o.textContent=fmt(p,n);r.classList.add('chg');keep()};
 mi.onclick=()=>ch(-st);pl.onclick=()=>ch(st);return r}
function render(){const C=document.getElementById('cats');C.innerHTML='';
 CATS.forEach(([id,tr,en])=>{const ps=PARAMS.filter(p=>p.cat==id),rs=RULES.filter(x=>x.cat==id);if(!ps.length&&!rs.length)return;
  const dt=document.createElement('details');dt.className='cat';dt.open=openCat==id;dt.innerHTML='<summary>'+t(tr,en)+'</summary>';
  dt.ontoggle=()=>{if(dt.open){openCat=id;C.querySelectorAll('details').forEach(o=>{if(o!==dt)o.open=false})}};
  ps.forEach(p=>dt.appendChild(item(p)));
  if(rs.length){const h=document.createElement('div');h.className='rh';h.textContent=t('Kurallar','Rules');dt.appendChild(h);
   rs.forEach(x=>{const on=rulesChanged[x.id]??saved.r?.[x.id]??true;const r=document.createElement('div');r.className='it';
    r.innerHTML='<div class="top"><label>'+t(x.tr,x.en)+'</label><input type="checkbox" class="sw"></div>';const c=r.querySelector('input');c.checked=on;
    c.onchange=()=>{rulesChanged[x.id]=c.checked;r.classList.add('chg');keep()};dt.appendChild(r)})}
  C.appendChild(dt)});
 document.querySelectorAll('[data-'+L+']').forEach(e=>e.textContent=e.dataset[L]);
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));
}
function keep(){saved.p=Object.assign(saved.p||{},changed);saved.r=Object.assign(saved.r||{},rulesChanged);S.set('values',JSON.stringify(saved))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;S.set('lang',L);render()});
const code=document.getElementById('code');code.value=S.get('code')||'';{const k=new URLSearchParams(location.search).get('kod');if(k){code.value=k;S.set('code',k)}}
function norm(s){s=(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(s.length!=8||/[^ABCDEFGHJKLMNPQRSTUVWXYZ23456789]/.test(s))return null;return s}
document.getElementById('send').onclick=async()=>{const m=document.getElementById('msg');const c=norm(code.value);
 if(!c){m.className='msg err';m.textContent=t('Aracın kodunu kontrol edin (8 hane).','Check the car code (8 characters).');return}
 S.set('code',c.slice(0,4)+'-'+c.slice(4));
 const params=Object.assign({},changed),rules=Object.assign({},rulesChanged);
 if(!Object.keys(params).length&&!Object.keys(rules).length){m.className='msg err';m.textContent=t('Önce bir ayarı değiştirin.','Change a setting first.');return}
 const body={format:'smartdrive-settings',version:1,updatedAt:Date.now(),params,rules};
 m.className='msg';m.textContent=t('Gönderiliyor…','Sending…');
 try{const r=await fetch('https://ntfy.sh/bydsmartdrive-'+c.toLowerCase(),{method:'POST',body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status);m.className='msg ok';m.textContent=t('Gönderildi. Araç açıksa birkaç saniye içinde uygulanır.','Sent. If the car is on, it applies within seconds.');
  Object.keys(changed).forEach(k=>delete changed[k]);Object.keys(rulesChanged).forEach(k=>delete rulesChanged[k]);render()}
 catch(e){m.className='msg err';m.textContent=t('Gönderilemedi, internet bağlantısını kontrol edin.','Could not send, check your internet connection.')}};
render();
</script></body></html>
