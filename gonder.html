<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYD Smart Drive · Araca gönder</title><meta name="theme-color" content="#0E1A30">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smart Drive"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#0E1A30;--card:#15264A;--border:#223A66;--tile:#11203E;--btn:#1B3260;--text:#F2F6FC;--sub:#A8B9D6;--muted:#7A8DB0;--accent:#2E86F5;--ok:#3BD18A;--warn:#FFB547}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:8px 0 4px;font-weight:650;letter-spacing:-.01em}h2{font-size:18px;margin:0 0 10px;font-weight:600}
.by{color:var(--sub);margin:0 0 18px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:0 0 14px}
.hint{color:var(--sub);font-size:14px;margin:6px 0 0}.btn{display:block;width:100%;text-align:center;border:0;border-radius:14px;padding:14px 16px;font:600 17px system-ui,sans-serif;background:var(--btn);color:var(--text);text-decoration:none;cursor:pointer;margin-top:12px}
.btn.primary{background:var(--accent);color:#fff}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border)}
.row:first-of-type{border-top:0}.row label{flex:1;font-size:15px}.val{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}input[type=text]{width:100%;background:var(--tile);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font:600 20px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:3px}.seg button{border:0;background:none;color:var(--sub);padding:6px 12px;border-radius:8px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}.sw{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--btn);position:relative;flex:none;cursor:pointer}
.sw:checked{background:var(--ok)}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}.sw:checked::after{left:21px}
.slider{padding:10px 0;border-top:1px solid var(--border)}.slider .top{display:flex;justify-content:space-between;gap:10px}
.msg{margin-top:12px;font-weight:600}.ok{color:var(--ok)}.err{color:var(--warn)}.lang{float:right}.small{font-size:13px;color:var(--muted)}
a{color:var(--accent)}
</style></head>
<body><main>
<div class="seg lang"><button data-l="tr" class="on">TR</button><button data-l="en">EN</button></div>
<h1 data-tr="Araca gönder" data-en="Send to the car">Araca gönder</h1><p class="by"><a href="index.html">BYD Smart Drive</a> · by Fatih Kurnaz</p>
<div class="card"><h2 data-tr="Aracın kodu" data-en="Car code">Aracın kodu</h2>
<input type="text" id="code" placeholder="K7Q2-M9XD" maxlength="9" autocomplete="off">
<h2 data-tr="Harita hedefi, link ya da video" data-en="Map destination, link or video">Harita hedefi, link ya da video</h2>
<input type="text" id="url" placeholder="https://maps.app.goo.gl/…" autocomplete="off">
<button class="btn" id="paste" data-tr="Panodan yapıştır" data-en="Paste from clipboard">Panodan yapıştır</button>
<button class="btn primary" id="send" data-tr="Araca gönder" data-en="Send to car">Araca gönder</button></div>
<div class="msg" id="msg"></div>
<div class="card"><h2 data-tr="📍 Android Auto / CarPlay ile gidenler" data-en="📍 Driving with Android Auto / CarPlay">📍 Android Auto / CarPlay ile gidenler</h2>
<p class="hint" data-tr="Araç, telefonda Android Auto / CarPlay'e yazılan hedefi göremez. Hedefi haritada bulup Paylaş ile buraya gönderin: araç rotadaki yokuşlara bakar (uzun yokuş varsa bataryayı önceden doldurur) ve Yol tarifi / Telefona gönder seçeneklerini gösterir. Google Maps, Apple Haritalar, Yandex ve Waze linkleri ya da 37.4297, 34.8742 gibi koordinat olur." data-en="The car can't see a destination typed into Android Auto / CarPlay on the phone. Find it on the map and Share it here: the car checks the route's climbs (fills the battery first if a long climb is ahead) and shows Directions / Send to phone. Google Maps, Apple Maps, Yandex and Waze links or coordinates like 37.4297, 34.8742 work.">…</p></div>
<div class="card"><h2 data-tr="Android: Paylaş menüsüne ekle" data-en="Android: add to the Share menu">Android: Paylaş menüsüne ekle</h2>
<p class="hint" data-tr="1) Bu sayfayı Chrome'da açın, ⋮ menü > Ana ekrana ekle (ya da Uygulamayı yükle). 2) Aracın kodunu bir kez yazıp bir şey gönderin (kod hatırlanır). 3) Google Maps'te hedefe dokunun > Paylaş > Smart Drive. Kod kayıtlıysa tek dokunuşla kendiliğinden gönderilir." data-en="1) Open this page in Chrome, ⋮ menu > Add to Home screen (or Install app). 2) Type the car code once and send something (it's remembered). 3) In Google Maps tap the place > Share > Smart Drive. With the code saved it sends by itself.">…</p></div>
<div class="card"><h2 data-tr="iPhone: Paylaş menüsüne Kestirme" data-en="iPhone: a Shortcut in the Share menu">iPhone: Paylaş menüsüne Kestirme</h2>
<p class="hint" data-tr="1) Bu sayfayı Safari'de açın, Paylaş > Ana Ekrana Ekle; açıp aracın kodunu bir kez yazın ve bir şey gönderin. 2) Kestirmeler uygulaması > + > adı: Araca gönder. Ayrıntılar (ⓘ) > Paylaşma Sayfasında Göster: açık. 3) Eylem ekle: Metin, içine yazın: https://fkurnaz58.github.io/byd-smart-drive/gonder.html?url= ve hemen arkasına Kestirme Girdisi değişkenini ekleyin. 4) Eylem ekle: URL'leri Aç. 5) Apple Haritalar ya da Google Maps'te yer > Paylaş > Araca gönder. Sayfa açılır ve kendiliğinden gönderir." data-en="1) Open this page in Safari, Share > Add to Home Screen; open it, type the car code once and send something. 2) Shortcuts app > + > name: Send to car. Details (ⓘ) > Show in Share Sheet: on. 3) Add action Text with: https://fkurnaz58.github.io/byd-smart-drive/gonder.html?url= followed directly by the Shortcut Input variable. 4) Add action Open URLs. 5) In Apple Maps or Google Maps: place > Share > Send to car. The page opens and sends by itself.">…</p>
<p class="hint" data-tr="Kestirme kurmak istemezseniz: haritada Paylaş > Kopyala, sonra bu sayfada Panodan yapıştır > Araca gönder." data-en="Without a Shortcut: in the map Share > Copy, then here Paste from clipboard > Send to car.">…</p></div>
<p class="small" data-tr="Link aracın Bildirimler listesine düşer; orada Aç'a dokununca tarayıcıda açılır. Android'de bu sayfayı Ana ekrana ekleyip Paylaş menüsünden de gönderebilirsiniz." data-en="The link lands in the car's Notifications; tap Open there to open it in the browser. On Android add this page to the home screen and you can also use the Share menu.">…</p>
</main><script>
const S={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let L=S.get('lang')||'tr';const t=(tr,en)=>L=='en'?en:tr;
function lang(){document.querySelectorAll('[data-'+L+']').forEach(e=>e.textContent=e.dataset[L]);document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;S.set('lang',L);lang()});
const code=document.getElementById('code');code.value=S.get('code')||'';
function norm(s){s=(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(s.length!=8||/[^ABCDEFGHJKLMNPQRSTUVWXYZ23456789]/.test(s))return null;return s}
const q=new URLSearchParams(location.search);const sh=(q.get('url')||'')+' '+(q.get('text')||'')+' '+(q.get('title')||'');
function pick(s){s=s||'';const m=s.match(/https?:\/\/\S+/);if(m)return m[0];const c=s.match(/(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/);if(c)return 'https://maps.google.com/?q='+c[1]+','+c[2];return null}
const shared=pick(sh);if(shared)document.getElementById('url').value=shared;
document.getElementById('paste').onclick=async()=>{try{const x=await navigator.clipboard.readText();const p=pick(x);document.getElementById('url').value=p||x}catch(e){const m=document.getElementById('msg');m.className='msg err';m.textContent=t('Pano okunamadı; uzun basıp Yapıştır deyin.','Clipboard unavailable; long-press and Paste.')}};
document.getElementById('send').onclick=async()=>{const m=document.getElementById('msg');const c=norm(code.value);
 const u=pick(document.getElementById('url').value);
 if(!c){m.className='msg err';m.textContent=t('Aracın kodunu kontrol edin (8 hane).','Check the car code (8 characters).');return}
 if(!u){m.className='msg err';m.textContent=t('Bir harita linki, koordinat ya da http ile başlayan adres yazın.','Enter a map link, coordinates or an address starting with http.');return}
 S.set('code',c.slice(0,4)+'-'+c.slice(4));m.className='msg';m.textContent=t('Gönderiliyor…','Sending…');
 try{const r=await fetch('https://ntfy.sh/bydsmartdrive-link-'+c.toLowerCase(),{method:'POST',body:u});
  if(!r.ok)throw new Error(r.status);m.className='msg ok';m.textContent=t('Gönderildi. Araç açık ve internete bağlıysa birkaç saniye içinde gelir.','Sent. If the car is on and online it arrives within seconds.')}
 catch(e){m.className='msg err';m.textContent=t('Gönderilemedi, internet bağlantısını kontrol edin.','Could not send, check your internet connection.')}};
lang();
if(shared&&norm(code.value))document.getElementById('send').click();
</script></body></html>
